<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Subscribed! — DescGen AI</title>
<meta name="theme-color" content="#050816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#050816;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{max-width:480px;margin:auto;padding:40px 24px;text-align:center;}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:40px;}
h1{font-size:30px;margin-bottom:14px;}
p{color:#A7B6D6;line-height:1.7;margin-bottom:26px;}
a.btn{display:inline-block;padding:16px 30px;border-radius:14px;background:linear-gradient(135deg,#8B5CF6,#2563EB);color:white;text-decoration:none;font-weight:700;}
.emoji{font-size:56px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="glass">
    <div class="emoji">🎉</div>
    <h1>You're All Set!</h1>
    <p>Thanks for subscribing to DescGen AI. Unlimited generations are now unlocked on this browser.</p>
    <a class="btn" href="/index.html">Start Generating →</a>
  </div>
</div>

<script>
// Unlock unlimited generations on this device
localStorage.setItem("descgen_subscribed", "true");
localStorage.setItem("descgen_subscribed_date", new Date().toISOString());
</script>
</body>
</html>
